name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-os: linux
            bin-name: busy-incremental-beaver
            archive-ext: tar.gz
          - os: macos-latest
            target-os: macos
            bin-name: busy-incremental-beaver
            archive-ext: tar.gz
          - os: windows-latest
            target-os: windows
            bin-name: busy-incremental-beaver.exe
            archive-ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers
        if: matrix.target-os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features opengl

      - name: Package (unix)
        if: matrix.target-os != 'windows'
        run: |
          cd target/release
          tar -czf ../../busy-incremental-beaver-${{ matrix.target-os }}.${{ matrix.archive-ext }} ${{ matrix.bin-name }}

      - name: Package (windows)
        if: matrix.target-os == 'windows'
        run: |
          cd target/release
          7z a ../../busy-incremental-beaver-${{ matrix.target-os }}.${{ matrix.archive-ext }} ${{ matrix.bin-name }}

      - uses: actions/upload-artifact@v4
        with:
          name: busy-incremental-beaver-${{ matrix.target-os }}
          path: busy-incremental-beaver-${{ matrix.target-os }}.${{ matrix.archive-ext }}

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
